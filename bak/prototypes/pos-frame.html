<!doctype html>
<html lang="zh-CN" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS 框架草图</title>
<!-- 全线点餐 POS · 原型框架草图：按 docs/全线点餐POS-功能区清单.md 的 27 个功能区搭线框。
     工作台、浮层、布局（L1–L6）、风格（主题色、形状、深浅、密度）、功能区标注都写在 <html> 的属性上，本地记住选择。 -->
<style>
:root {
  /* 黑白灰与语义色按 docs/POS配色方案.md；主题色、辅助色由 data-skin 给出 -l（浅）/ -d（深）两组值 */
  --bg: #E4E6EA; --surface: #FFFFFF; --s2: #E8EBEF; --s3: #DADDE0; --s4: #D3D6DA;
  --fg: #181A1C; --fg2: #616367; --fg3: #9C9FA2;
  --warn: #B54708; --warn-tint: #FEEFDD; --danger: #B42318; --danger-tint: #FAE2E0; --ok: #067647;
  --brand: var(--p-l); --on-brand: var(--on-l); --brand-text: var(--pt-l); --tint: var(--ti-l); --aux: var(--a-l); --aux-tint: var(--at-l);
  --annot: #FF6A00; --scrim: rgba(15, 16, 18, .42);
  --r-card: 13px; --r-btn: 999px; --r-tag: 999px; --r-ctl: 10px;
  --ctl: 44px; --tile: 88px; --gap: 8px;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  color: var(--fg);
}
:root[data-mode="dark"] {
  --bg: #07080B; --surface: #15171A; --s2: #242729; --s3: #313336; --s4: #37393C;
  --fg: #EDF0F4; --fg2: #A8ABAF; --fg3: #727578;
  --warn: #FDB022; --warn-tint: #3E2D17; --danger: #F97066; --danger-tint: #3C1F1F; --ok: #47CD89;
  --scrim: rgba(0, 0, 0, .6);
  --brand: var(--p-d); --on-brand: var(--on-d); --brand-text: var(--pt-d); --tint: var(--ti-d); --aux: var(--a-d); --aux-tint: var(--at-d);
}
@media (prefers-color-scheme: dark) {
  :root[data-mode="auto"] {
    --bg: #07080B; --surface: #15171A; --s2: #242729; --s3: #313336; --s4: #37393C;
    --fg: #EDF0F4; --fg2: #A8ABAF; --fg3: #727578;
    --warn: #FDB022; --warn-tint: #3E2D17; --danger: #F97066; --danger-tint: #3C1F1F; --ok: #47CD89;
    --scrim: rgba(0, 0, 0, .6);
    --brand: var(--p-d); --on-brand: var(--on-d); --brand-text: var(--pt-d); --tint: var(--ti-d); --aux: var(--a-d); --aux-tint: var(--at-d);
  }
}
/* 8 套主题：主色 p、实心上的字 on、主色文字 pt、主色 tint ti、辅助色 a、辅助 tint at */
[data-skin="pine"] { --p-l: #1D6E58; --p-d: #67A993; --on-l: #FFFFFF; --on-d: #00140C; --pt-l: #005E49; --pt-d: #90CBB5; --ti-l: #E4EEEB; --ti-d: #253432; --a-l: #3F6789; --a-d: #98BEDF; --at-l: #E8EDF1; --at-d: #2F3841; }
[data-skin="indigo"] { --p-l: #485FA2; --p-d: #829BDB; --on-l: #FFFFFF; --on-d: #070D1F; --pt-l: #3A4F90; --pt-d: #A7BEF9; --ti-l: #E9ECF4; --ti-d: #2B3141; --a-l: #276E6C; --a-d: #86C3C0; --at-l: #E5EEED; --at-d: #2C393B; }
[data-skin="teal"] { --p-l: #276B80; --p-d: #69A4B8; --on-l: #FFFFFF; --on-d: #00121B; --pt-l: #105A6F; --pt-d: #93C7DA; --ti-l: #E5EDF0; --ti-d: #26333A; --a-l: #7B587C; --a-d: #D0ADD1; --at-l: #EFEBEF; --at-d: #3A353F; }
[data-skin="tea"] { --p-l: #526932; --p-d: #8EA571; --on-l: #FFFFFF; --on-d: #091101; --pt-l: #435A23; --pt-d: #B1C798; --ti-l: #EAEDE6; --ti-d: #2D332B; --a-l: #456783; --a-d: #9DBDDA; --at-l: #E9EDF0; --at-d: #303840; }
[data-skin="slate"] { --p-l: #586474; --p-d: #909DAC; --on-l: #FFFFFF; --on-d: #060F1B; --pt-l: #485463; --pt-d: #B5C0CF; --ti-l: #EBECEE; --ti-d: #2E3237; --a-l: #496C50; --a-d: #A0C2A5; --at-l: #E9EDEA; --at-d: #313936; }
[data-skin="umber"] { --p-l: #88573E; --p-d: #C2927A; --on-l: #FFFFFF; --on-d: #1C0801; --pt-l: #75462D; --pt-d: #E2B6A0; --ti-l: #F1EBE8; --ti-d: #38302D; --a-l: #356B77; --a-d: #90C1CD; --at-l: #E7EDEF; --at-d: #2E393E; }
[data-skin="crimson"] { --p-l: #99485A; --p-d: #D58694; --on-l: #FFFFFF; --on-d: #1C060B; --pt-l: #88384B; --pt-d: #F5ABB8; --ti-l: #F3E9EB; --ti-d: #3B2D32; --a-l: #336C6F; --a-d: #8FC2C5; --at-l: #E7EDEE; --at-d: #2D393C; }
[data-skin="mono"] { --p-l: #181A1C; --p-d: #EDF0F4; --on-l: #FFFFFF; --on-d: #07080B; --pt-l: #181A1C; --pt-d: #EDF0F4; --ti-l: #E1E1E1; --ti-d: #383A3D; --a-l: #546488; --a-d: #A8B9DD; --at-l: #EAECF1; --at-d: #323741; }
/* 形状 */
[data-shape="round"]  { --r-card: 8px; --r-btn: 8px; --r-tag: 6px; --r-ctl: 8px; }
[data-shape="square"] { --r-card: 4px; --r-btn: 4px; --r-tag: 3px; --r-ctl: 4px; }
/* 密度 */
[data-density="standard"] { --ctl: 48px; --tile: 108px; --gap: 12px; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-size: 14px; line-height: 1.45; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- 原型外的控制条 ---------- */
.page { padding: 16px; max-width: 1760px; margin: 0 auto; }
.ph-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin-bottom: 12px; }
.ph-head h1 { font-size: 20px; margin: 0; font-weight: 700; }
.ph-head p { margin: 0; color: var(--fg2); font-size: 13px; }
.ph-head a { color: var(--fg2); }
.bar { display: flex; flex-wrap: wrap; gap: 8px 20px; padding: 12px; background: var(--surface); border-radius: 12px; margin-bottom: 12px; }
.grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.grp > b { font-size: 12px; color: var(--fg2); font-weight: 600; margin-right: 2px; }
.seg { display: inline-flex; background: var(--s2); border-radius: 8px; padding: 2px; flex-wrap: wrap; }
.seg button { padding: 5px 10px; border-radius: 6px; font-size: 13px; color: var(--fg2); min-height: 30px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.lay { display: inline-flex; align-items: center; gap: 6px; }
.mini { width: 30px; height: 20px; display: grid; gap: 1.5px; padding: 1.5px; background: var(--s3); border-radius: 3px; }
.mini i { background: var(--surface); border-radius: 1px; }
.mini i.n { background: var(--fg3); }
.mini i.d { background: var(--brand); }
.sw { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, var(--c) 0 58%, var(--c2) 58%); box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--fg); }

.main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
@media (min-width: 1500px) { .main { grid-template-columns: minmax(0, 1fr) 300px; } }
.stage { width: 100%; position: relative; }
.device { width: 1280px; height: 800px; transform-origin: top left; position: absolute; left: 0; top: 0;
  background: var(--bg); border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 10px #1C1D20, 0 12px 40px rgba(0,0,0,.25); }

.legend { background: var(--surface); border-radius: 12px; padding: 12px; }
.legend h2 { font-size: 14px; margin: 0 0 4px; }
.legend p.hint { margin: 0 0 8px; color: var(--fg2); font-size: 12px; }
.legend h3 { font-size: 12px; color: var(--fg2); font-weight: 600; margin: 12px 0 4px; }
.lg { display: grid; grid-template-columns: 34px 1fr; gap: 0 8px; width: 100%; text-align: left; padding: 6px 8px; border-radius: 8px; }
.lg:hover { background: var(--s2); }
.lg[aria-pressed="true"] { background: var(--warn-tint); }
.lg code { font: 600 12px/20px ui-monospace, Menlo, monospace; color: var(--annot); }
.lg b { font-size: 13px; font-weight: 600; }
.lg small { grid-column: 2; color: var(--fg2); font-size: 12px; }

/* ---------- 设备内：外壳 ---------- */
.app { display: grid; grid-template-rows: 56px 1fr; height: 100%; position: relative; }
.sys { display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--surface); }
.sys > section { display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 6px; }
.g1 { min-width: 230px; }
.g1 .logo { width: 32px; height: 32px; border-radius: 8px; background: var(--fg); color: var(--surface); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.g1 .who b { display: block; font-size: 13px; line-height: 1.2; }
.g1 .who small { color: var(--fg2); font-size: 12px; }
.g2 { flex: 1; justify-content: center; }
.g2 button { height: 40px; padding: 0 16px; border-radius: var(--r-btn); color: var(--fg2); font-weight: 600; }
.g2 button[aria-current="true"] { background: var(--fg); color: var(--surface); }
.ent { height: 40px; min-width: 44px; padding: 0 10px; border-radius: var(--r-btn); background: var(--s2); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg2); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg3); flex: none; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--danger); }
.cnt { background: var(--danger); color: #fff; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 0 6px; line-height: 18px; }
.clock { font-weight: 700; font-size: 15px; padding-left: 4px; }

.body { display: grid; gap: var(--gap); padding: var(--gap); min-height: 0; }
.body > * { min-height: 0; min-width: 0; }
.panel { background: var(--surface); border-radius: var(--r-card); }

/* 导航区（Z3）：竖排 96px，横排 48px */
.nav { grid-area: nav; display: flex; flex-direction: column; gap: 4px; padding: 6px; overflow: hidden auto; }
.nav .nv { min-height: var(--ctl); border-radius: var(--r-ctl); padding: 6px 8px; text-align: left; color: var(--fg2); display: flex; align-items: center; justify-content: space-between; gap: 4px; font-size: 13px; flex: none; }
.nav .nv[aria-current="true"] { background: var(--fg); color: var(--surface); font-weight: 600; }
/* 墨黑主题：墨色已是主题色，位置选中改用灰底，结账保持唯一的墨块 */
[data-skin="mono"] .nav .nv[aria-current="true"], [data-skin="mono"] .chip[aria-pressed="true"], [data-skin="mono"] .g2 button[aria-current="true"] { background: var(--s3); color: var(--fg); }
.nav .nv em { font-style: normal; font-size: 12px; opacity: .8; }
.nav .sep { height: 1px; background: var(--s3); margin: 4px 2px; flex: none; }
.nav .cap { font-size: 12px; color: var(--fg3); padding: 4px 8px 0; flex: none; }
[data-nav="top"] .nav { flex-direction: row; align-items: center; padding: 4px 6px; overflow: auto hidden; }
[data-nav="top"] .nav .nv { min-height: 36px; padding: 0 14px; border-radius: var(--r-btn); white-space: nowrap; }
[data-nav="top"] .nav .sep { width: 1px; height: 24px; margin: 0 6px; }
[data-nav="top"] .nav .cap { display: none; }

.content { grid-area: content; display: flex; flex-direction: column; gap: var(--gap); }
.detail { grid-area: detail; display: flex; flex-direction: column; overflow: hidden; }
.detail > section { padding: 12px; }
.detail .grow { flex: 1; overflow: auto; min-height: 0; }
.detail .foot { background: var(--s2); }

/* 通用小件 */
.row { display: flex; align-items: center; gap: 8px; }
.sp { flex: 1; }
.t-sub { color: var(--fg2); font-size: 12px; }
.t-h { font-size: 17px; font-weight: 700; }
.chip { height: 36px; padding: 0 14px; border-radius: var(--r-btn); background: var(--s2); color: var(--fg2); font-size: 13px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--surface); font-weight: 600; }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: var(--r-tag); font-size: 12px; background: var(--s3); color: var(--fg2); white-space: nowrap; }
.tag.brand { background: var(--tint); color: var(--brand-text); }
.tag.aux { background: var(--aux-tint); color: var(--aux); }
.chip.aux { background: var(--aux-tint); color: var(--aux); }
.tag.warn { background: var(--warn-tint); color: var(--warn); }
.tag.bad { background: var(--danger-tint); color: var(--danger); }
.btn { min-height: var(--ctl); padding: 0 16px; border-radius: var(--r-btn); font-weight: 600; background: var(--s3); color: var(--fg); display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.btn.soft { background: var(--tint); color: var(--brand-text); }
.btn.pri { background: var(--brand); color: var(--on-brand); }
.btn.dng { background: var(--danger-tint); color: var(--danger); }
.btn.ghost { background: var(--s2); color: var(--fg2); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--fg2); } .kv dd { margin: 0; text-align: right; }
.big { font-size: 30px; font-weight: 700; letter-spacing: -.01em; }
.ph { background: var(--s3); border-radius: 4px; height: 10px; }
.input { height: var(--ctl); border-radius: var(--r-ctl); background: var(--s2); display: flex; align-items: center; padding: 0 12px; color: var(--fg3); font-size: 13px; gap: 8px; }
.step { display: inline-flex; align-items: center; background: var(--s2); border-radius: var(--r-btn); }
.step span { width: 36px; height: 36px; display: grid; place-items: center; font-weight: 700; }
.step b { min-width: 22px; text-align: center; }

/* 菜品宫格 M4 */
.tools { padding: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tools .input { flex: 1; min-width: 120px; }
.grid { flex: 1; overflow: auto; padding: 8px; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--gap); align-content: start; }
.dish { min-height: var(--tile); border-radius: calc(var(--r-card) - 3px); background: var(--s2); padding: 10px; display: flex; flex-direction: column; text-align: left; position: relative; gap: 2px; }
.dish b { font-weight: 600; font-size: 14px; }
.dish .pr { margin-top: auto; font-weight: 700; }
.dish .q { position: absolute; top: 6px; right: 6px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--brand); color: var(--on-brand); font-size: 12px; font-weight: 700; display: grid; place-items: center; padding: 0 6px; }
.dish.sel { background: var(--tint); }
.dish.out { opacity: 1; background: var(--s2); color: var(--fg3); }
.dish.out b { color: var(--fg2); }
/* 有图菜品卡：上图下文，图 4:3；没有图的菜用分类色块加菜名前两个字顶替 */
[data-pic="on"] .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); grid-auto-rows: max-content; }
.dish.img { padding: 0; overflow: hidden; gap: 0; }
.dish .pic { position: relative; aspect-ratio: 4 / 3; display: grid; place-items: center;
  background: radial-gradient(circle at var(--fx, 50%) 56%, var(--ks, #B07A4A) 0 21%, transparent 22%),
    radial-gradient(circle at 50% 56%, #F4F1EC 0 33%, #D8D2C9 34% 36%, transparent 37%),
    linear-gradient(160deg, #6B5442, #33281F); }
.dish .pic.none { background: var(--s3); color: var(--fg2); }
.dish .pic .abbr { font-size: 24px; font-weight: 700; letter-spacing: .04em; }
[data-scheme="blocks"][data-tone="solid"] .dish .pic.none { background: var(--ks); color: var(--ksf); }
[data-scheme="blocks"][data-tone="pastel"] .dish .pic.none { background: var(--kp); color: var(--kpf); }
.dish .pic .tag { position: absolute; left: 6px; bottom: 6px; background: var(--surface); }
.dish .pic .tag.warn { background: var(--warn-tint); }
.dish.out .pic { filter: grayscale(1); opacity: .45; }
.dish .info { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.dish .info .row { gap: 6px; margin-top: auto; }
.dish .info .pr { margin-top: 0; }

/* 已点清单 M5 */
.lines h4 { margin: 4px 0 6px; font-size: 12px; color: var(--fg2); font-weight: 600; display: flex; gap: 6px; align-items: center; }
.ln { display: grid; grid-template-columns: 1fr auto auto; gap: 2px 10px; align-items: center; padding: 8px; border-radius: 8px; }
.ln:hover { background: var(--s2); }
.ln b { font-weight: 600; } .ln .sub { grid-column: 1 / -1; }
.ln.new { background: var(--tint); }

/* 桌台图 T2 */
.tables { flex: 1; overflow: auto; padding: 8px; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: var(--gap); align-content: start; }
.tb { min-height: 104px; border-radius: calc(var(--r-card) - 3px); background: var(--s2); padding: 10px; display: flex; flex-direction: column; gap: 4px; text-align: left; }
.tb b { font-size: 17px; }
.tb.busy { background: var(--tint); }
.tb.busy .tag.brand, .tb.resv .tag.aux { background: var(--surface); }
.foot .btn.ghost, .foot .chip { background: var(--s3); color: var(--fg); }
.foot .chip.aux { background: var(--aux-tint); color: var(--aux); }
.tb.due { background: var(--warn-tint); }
.tb.resv { background: var(--aux-tint); }
.tb.cur { box-shadow: inset 0 0 0 2px var(--fg); }
.tb .row { margin-top: auto; justify-content: space-between; font-size: 12px; color: var(--fg2); }
.stats { display: flex; gap: var(--gap); padding: 8px 8px 0; }
.stat { flex: 1; background: var(--s2); border-radius: 8px; padding: 8px 12px; }
.stat b { display: block; font-size: 20px; }

/* 收款 P2 */
.pays { display: grid; grid-template-columns: repeat(6, 1fr); gap: var(--gap); padding: 12px; }
.pay { min-height: 64px; border-radius: calc(var(--r-card) - 3px); background: var(--s2); font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.pay[aria-pressed="true"] { background: var(--tint); color: var(--brand-text); box-shadow: inset 0 0 0 2px var(--brand); }
.pay small { font-weight: 400; color: var(--fg2); font-size: 12px; }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); }
.keys button { height: 60px; border-radius: var(--r-ctl); background: var(--s2); font-size: 20px; font-weight: 600; }

/* 订单列表 O2 */
.olist { flex: 1; overflow: auto; padding: 4px 8px 8px; }
.orow { display: grid; grid-template-columns: 70px 60px 60px 1fr 90px 60px 70px; gap: 8px; align-items: center; padding: 0 8px; min-height: 52px; border-radius: 8px; font-size: 13px; }
.orow.th { min-height: 32px; color: var(--fg3); font-size: 12px; }
.orow.cur { background: var(--tint); }

/* ---------- 浮层（X1–X4、P3、S1） ---------- */
.scrim { position: absolute; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 20; }
.modal { width: 560px; max-height: 720px; overflow: auto; background: var(--surface); border-radius: calc(var(--r-card) + 3px); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.modal.wide { width: 760px; }
.modal h3 { margin: 0; font-size: 20px; }
.opt { display: flex; flex-wrap: wrap; gap: 8px; }
.opt .chip { height: 40px; }
.sheet { position: absolute; top: 0; right: 0; bottom: 0; width: 520px; background: var(--surface); z-index: 21; display: flex; flex-direction: column; box-shadow: -8px 0 32px rgba(0,0,0,.18); }
.sheet .tabs { display: flex; gap: 4px; padding: 12px 16px 0; }
.sheet .in { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.sheet h4 { margin: 0 0 8px; font-size: 13px; color: var(--fg2); font-weight: 600; }
.layg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.layg button { background: var(--s2); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--fg2); }
.layg button .mini { width: 60px; height: 38px; }

    if (S.ov === 's1') return '<div class="scrim">' + zone('S1', 'modal', '<h3>开班</h3><div class="row"><span style="width:72px">收银台</span><div class="input" style="flex:1">1 号收银台 ▾</div></div>' +
      '<div class="row"><span style="width:72px">备用金</span><div class="input" style="flex:1">¥500.00</div></div>' +
      '<div><h4 class="t-sub" style="margin:0 0 6px">设备自检</h4><dl class="kv"><dt>前台打印机</dt><dd><span class="tag">正常</span></dd><dt>热菜档口打印机</dt><dd><span class="tag warn">缺纸</span></dd><dt>网络</dt><dd><span class="tag">正常</span></dd><dt>钱箱</dt><dd><span class="tag">正常</span></dd></dl></div>' +
      '<div class="row"><span class="t-sub">有异常也能开班，热菜单会排队等待</span><span class="sp"></span><button class="btn pri" data-set="ov:none">开班</button></div>') + '</div>';
    if (S.ov === 'x4') {
      var tabs = [['takeout', '外卖'], ['member', '会员'], ['print', '打印'], ['net', '网络'], ['todo', '待办'], ['set', '设置']];
      var body;
      if (S.sheet === 'set') body = '<div data-zone="G5"><h4>布局 · 导航区与详情区的位置</h4><div class="layg">' + layoutBtns(true) + '</div></div>' +
        schemeCtl(true) + '<div><h4>菜品图</h4>' + seg('pic', [['on', '有图'], ['off', '无图']], S.pic) + '</div>' +
        '<div><h4>形状</h4>' + seg('shape', SHAPES, S.shape) + '</div><div><h4>深浅</h4>' + seg('mode', MODES, S.mode) + '</div><div><h4>密度</h4>' + seg('density', DENS, S.density) + '</div>';
      else if (S.sheet === 'takeout') body = ['美团 #88 · 4 件 · ¥96', '饿了么 #31 · 2 件 · ¥42'].map(function (t) { return '<div class="row"><span>' + t + '</span><span class="sp"></span><button class="btn ghost">拒单</button><button class="btn pri">接单</button></div>'; }).join('') + '<div class="ph" style="width:60%"></div>';
      else if (S.sheet === 'member') body = '<div class="input">输入手机号或扫会员码</div><dl class="kv"><dt>会员</dt><dd>138****6621 · 金卡</dd><dt>余额</dt><dd>¥520.00</dd><dt>积分</dt><dd>2,310</dd><dt>可用券</dt><dd>满 200 减 10</dd></dl>';
      else if (S.sheet === 'print') body = '<dl class="kv"><dt>前台打印机</dt><dd><span class="tag">正常</span></dd><dt>热菜档口</dt><dd><span class="tag warn">缺纸 · 2 单待打</span></dd><dt>凉菜档口</dt><dd><span class="tag">正常</span></dd><dt>吧台</dt><dd><span class="tag">正常</span></dd></dl><div class="row"><button class="btn ghost">补打</button><button class="btn ghost">开钱箱</button><span class="sp"></span><button class="btn pri">重打失败单</button></div>';
      else if (S.sheet === 'net') body = '<dl class="kv"><dt>门店服务器</dt><dd><span class="tag">已连接</span></dd><dt>支付网关</dt><dd><span class="tag">已连接</span></dd><dt>待同步</dt><dd>0 单</dd></dl><div class="t-sub">离线时可点菜、送厨（进队列）、收现金和刷卡；扫码支付不可用</div>';
      else body = ['外卖待接 2 单', '热菜档口打印失败 2 单', 'A03 小炒黄牛肉催菜'].map(function (t) { return '<div class="row"><span>' + t + '</span><span class="sp"></span><button class="btn ghost">处理</button></div>'; }).join('');
      return '<div class="scrim" data-set="ov:none"></div>' + zone('X4', 'sheet', '<div class="row" style="padding:16px 16px 0"><span class="t-h">' + tabs.filter(function (t) { return t[0] === S.sheet; })[0][1] + '</span><span class="sp"></span><button class="btn ghost" data-set="ov:none">关闭</button></div>' +
        '<div class="tabs">' + tabs.map(function (t) { return '<button class="chip" data-set="sheet:' + t[0] + '" aria-pressed="' + (S.sheet === t[0]) + '">' + t[1] + '</button>'; }).join('') + '</div><div class="in">' + body + '</div>', 'aside');
    }
    return '';
  }

  /* ---------- 原型控制条与图例 ---------- */
  var SCHEMES = [['blocks', '色块'], ['theme', '主题色']], TONES = [['solid', '实色'], ['pastel', '粉彩']];
  function schemeCtl(inSheet) {
    var a = inSheet ? ['<div><h4>', '</h4>', '</div>'] : ['<div class="grp"><b>', '</b>', '</div>'];
    return a[0] + '配色' + a[1] + seg('scheme', SCHEMES, S.scheme) + a[2] +
      (S.scheme === 'blocks' ? a[0] + '色块' + a[1] + seg('tone', TONES, S.tone) + a[2]
                             : a[0] + '主题色' + a[1] + '<span class="row" style="flex-wrap:wrap">' + swatches() + '</span>' + a[2]);
  }
  function bar() {
    var wbs = Object.keys(WB).map(function (k) { return [k, WB[k].name]; });
    return '<div class="grp"><b>工作台</b>' + seg('wb', wbs, S.wb) + '</div>' +
      '<div class="grp"><b>浮层</b>' + seg('ov', OV, S.ov) + '</div>' +
      '<div class="grp"><b>布局</b><span class="seg">' + layoutBtns(false) + '</span></div>' +
      schemeCtl(false) + '<div class="grp"><b>菜品图</b>' + seg('pic', [['on', '有图'], ['off', '无图']], S.pic) + '</div>' +
      '<div class="grp"><b>形状</b>' + seg('shape', SHAPES, S.shape) + '</div>' +
      '<div class="grp"><b>深浅</b>' + seg('mode', MODES, S.mode) + '</div>' +
      '<div class="grp"><b>密度</b>' + seg('density', DENS, S.density) + '</div>' +
      '<div class="grp"><b>标注</b>' + seg('annot', [['on', '显示功能区'], ['off', '隐藏']], S.annot) + '</div>';
  }
  function legend() {
    var item = function (c) { return '<button class="lg" data-set="hl:' + (S.hl === c ? '' : c) + '" aria-pressed="' + (S.hl === c) + '"><code>' + c + '</code><b>' + Z[c][0] + ' <span class="t-sub">· ' + Z[c][1] + '</span></b><small>' + Z[c][2] + '</small></button>'; };
    var lay = LAYOUTS.filter(function (l) { return l[1] === S.nav && l[2] === S.detail; })[0];
    return '<h2>本屏功能区</h2><p class="hint">点一项在设备里高亮。当前布局 ' + lay[0] + '：' + lay[3] + (WB[S.wb].nav ? '' : '（本工作台没有导航区）') + '</p>' +
      '<h3>全局</h3>' + ['G1', 'G2', 'G3', 'G4', 'G5'].map(item).join('') +
      '<h3>' + WB[S.wb].name + '工作台</h3>' + WB[S.wb].zones.map(item).join('') +
      (OVZONE[S.ov] ? '<h3>浮层</h3>' + item(OVZONE[S.ov]) : '');
  }

  var stage = document.getElementById('stage'), device = document.getElementById('device');
  function fit() { var s = Math.min(1, stage.clientWidth / 1280); device.style.transform = 'scale(' + s + ')'; stage.style.height = (800 * s + 12) + 'px'; }

  function render() {
    ['scheme', 'tone', 'pic', 'skin', 'shape', 'mode', 'density', 'annot', 'nav', 'detail'].forEach(function (k) { root.setAttribute('data-' + k, S[k]); });
    var w = WB[S.wb], html = { tables: tablesWB, order: orderWB, checkout: checkoutWB, orders: ordersWB, shift: shiftWB }[S.wb]();
    device.innerHTML = '<div class="app">' + sysbar() + '<div class="body" id="body">' + html + '</div>' + overlay() + '</div>';
    var t = tmpl(S.nav, S.detail, w.nav, { N: '96px', D: '360px', T: '48px' }), body = document.getElementById('body');
    body.style.gridTemplateAreas = t[0]; body.style.gridTemplateColumns = t[1]; body.style.gridTemplateRows = t[2];
    Array.prototype.forEach.call(device.querySelectorAll('[data-zone]'), function (el) {
      var c = el.getAttribute('data-zone'); el.setAttribute('data-tag', c + ' ' + Z[c][0] + ' · ' + Z[c][1]);
      if (S.hl && c === S.hl) el.classList.add('hl');
    });
    document.getElementById('bar').innerHTML = bar();
    document.getElementById('legend').innerHTML = legend();
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-set]'); if (!b) return;
    b.getAttribute('data-set').split(',').forEach(function (p) { var i = p.indexOf(':'); S[p.slice(0, i)] = p.slice(i + 1); });
    render();
  });
  new ResizeObserver(fit).observe(stage);
  render(); fit();
})();
</script>
</body>
</html>
