<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全线点餐 POS · UI 原型 2.0</title>
<!-- UI 原型 2.0：四种风格（Apple · Material 3 · Uber Base · 玻璃态）。用 iframe 打开正式原型 bapp/pos-ui.html（?v=1.5 时开 pos-ui-v1.5.html），把 themes-v2.0.css 注入进去并设 data-style；正式稿一个字不改。
     #apple / #m3 / #uber / #glass / #base 选风格。导出用：?s=apple&only=03,04 只留指定小节、去掉页首。
     本地直接双击打开时 Chrome 会拦 iframe 访问，需用 prototypes 的本地服务器打开。 -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F4F4F6;--card:#fff;--ink:#17181A;--sub:#63676E;--line:#E4E5E8}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{max-width:1440px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.bar h1{font-size:17px;font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs a{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:#EEEFF1;color:var(--ink);text-decoration:none;font-size:14px;font-weight:500}
.tabs a i{width:12px;height:12px;border-radius:50%}
.tabs a[aria-current="true"]{background:var(--ink);color:#fff}
.spec{max-width:1440px;margin:0 auto;padding:0 24px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 20px;font-size:13px;color:var(--sub)}
.spec b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}
.alt{margin-left:auto;font-size:14px;color:var(--sub);text-decoration:none}
iframe{display:block;width:100%;border:0;min-height:100vh}
body.export header{display:none}
body.export iframe{min-height:0}
@media (max-width:640px){.bar{padding:12px 16px}.spec{padding:0 16px 12px}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>收银原型 2.0</h1><a class="alt" href="pos-components-v2.0.html">看组件库 2.0 →</a>
    <nav class="tabs" id="tabs"></nav>
  </div>
  <div class="spec" id="spec"></div>
</header>
<iframe id="lib" src="../bapp/pos-ui.html" title="收银原型"></iframe>
<script src="frame-v2.0.js"></script>
</body>
</html>
