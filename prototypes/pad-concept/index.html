1.7}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}.metric{padding:17px 18px;background:#fff;border:1px solid var(--line);border-radius:12px;text-align:left}.metric b{font-size:27px;display:block;margin-top:7px;font-weight:600;letter-spacing:-1px}.metric.active{border-color:#306f5f;background:var(--tint)}.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:20px}.search{flex:1;min-width:0;position:relative}.search input{width:100%;height:48px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 15px;font-size:13px}.seg{display:flex;background:#e9ede8;padding:4px;border-radius:10px}.seg button{min-height:40px;padding:0 14px;font-size:12px;border-radius:7px}.seg .on{background:white;box-shadow:0 1px 3px #17251a12}.section-title{display:flex;justify-content:space-between;margin:22px 0 14px;font-size:13px;color:var(--sub)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:14px}.table{background:#fff;min-height:156px;border:1px solid var(--line);border-radius:12px;padding:17px;text-align:left;position:relative;display:flex;flex-direction:column;gap:12px}.table.selected{border:2px solid var(--green);padding:16px;background:#f3f9f5}.table.attention{background:#fffaf0;border-color:#eee2c5}.table b{font-size:23px;letter-spacing:-.6px}.table-top{display:flex;align-items:center;justify-content:space-between}.capacity{font-size:11px;color:var(--sub)}.status{font-size:12px;color:var(--green);display:flex;align-items:center;gap:6px}.status:before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}.status.amber{color:#9a6b1c}.status.gray{color:#7a807c}.table-foot{display:flex;justify-content:space-between;font-size:12px;margin-top:auto}.table-foot strong{font-size:14px}.detail{background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:auto}.detail-head{padding:27px 24px 22px;border-bottom:1px solid var(--line)}.detail-head .t ground:linear-gradient(135deg,#ffffff22,#5b673811)}.dish-info{padding:14px}.dish-info b{font-size:15px}.dish-info small{font-size:10px;display:block;color:var(--sub);margin:7px 0 17px}.dish-bottom{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600}.add{width:28px;height:28px;border-radius:8px;background:var(--tint);color:var(--green);display:grid;place-items:center;font-size:20px}.dish.chosen{border-color:#8eaf9e}.count{position:absolute;right:10px;top:10px;background:var(--green);color:#fff;border-radius:7px;font-size:12px;padding:5px 8px;z-index:1}.order-tools{display:flex;gap:8px;margin-bottom:20px}.order-tools button{min-height:40px;padding:0 14px;background:white;border-radius:8px;border:1px solid var(--line);font-size:12px}.order-tools .on{border-color:#a1bfaf;background:var(--tint);color:var(--green)}.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:8px;margin-top:12px;width:140px;justify-content:space-between}.stepper button{min-width:48px;min-height:48px;font-size:18px}.stepper span{font-size:12px}.order-line{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:16px}.order-line .line{margin-bottom:0}.quiet{font-size:12px;color:var(--sub)}.empty{padding:50px 15px;text-align:center;color:var(--sub);font-size:13px;grid-column:1/-1}.toast{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);background:#233b32;color:#fff;border-radius:10px;padding:14px 24px;font-size:13px;box-shadow:0 8px 30px #0002}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(min-width:1440px){.work{grid-template-columns:140px minmax(0,1fr) 380px}main{padding:32px}.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}.dish-grid{grid-template-columns:repeat(auto-fill,minmax(186px,1fr))}.food{height:145px}}@media(max-width:1050px){header{padding:0 18px;gap:12px}.brand{width:180px}.system .hide-small{display:none}.work{grid-template-columns:96px minmax(0,1fr) 300px}main{padding:20px}.metrics{gap:8px}.metric{padding:13px}.metric b{font-size:24px}.grid{gap:10px;grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}.detail-body,.detail-foot,.detail-head{padding:20px}.tabs button{min-width:78px}.toolbar{flex-wrap:wrap}.dish-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}@media(max-width:760px){.work{height:auto;min-height:calc(100dvh - 104px);grid-template-columns:82px minmax(0,1fr)}.detail{grid-column:1/-1;border-top:1px solid var(--line);min-height:400px}.system{display:none}.brand{width:auto}.brand .small{display:none}header{gap:20px}.tabs{margin-left:auto}.tabs button{min-width:64px}.metrics{grid-template-columns:repeat(2,1fr)}main{padding:16px}.heading{align-items:start;gap:12px}h1{font-size:23px}.heading .secondary{display:none}.bottom{height:auto;min-height:28px}.bottom span:last-child{display:none}.rail{padding:24px 6px}.rail button{padding:0 8px}}</style></head><body>
<header><div class="brand"><span class="logo">禾</span><div><b>虹选小馆</b><div class="small" style="margin-top:4px">南山店 · 前台 01</div></div></div><nav class="tabs" aria-label="工作台"><button data-view="tables">桌台</button><button data-view="order">点餐</button></nav><div class="system"><span class="online">● 在线</span><span class="hide-small">午市 · 李敏</span><span class="avatar">敏</span><span class="hide-small">12:30</span></div></header>
<div class="work"><nav class="rail" id="rail" aria-label="分类"></nav><main id="main"></main><aside class="detail" id="detail" aria-label="当前桌台与订单"></aside></div><footer class="bottom"><span>PAD CONCEPT / 01 · 桌台与点餐</span><span>交互概念稿 · 示例数据 · 菜品图为示意</span></footer><div id="notice" role="status" aria-live="polite"></div>
<script>
const tables=[['A01','dining',4,2,36,156],['A02','free',4,0,0,0],['A03','dining',4,4,48,176],['A04','due',4,3,62,196],['A05','dining',4,2,25,128],['A06','free',4,0,0,0],['A07','late',6,5,58,356],['A08','clear',4,0,0,0],['A09','dining',4,3,32,208],['A10','free',2,0,0,0],['A11','booked',6,0,0,0],['A12','dining',4,2,18,96],['V01','free',8,0,0,0],['V02','dining',10,8,72,868],['V03','due',8,6,85,628],['V04','free',10,0,0,0]].map(([id,status,seats,people,minutes,amount])=>({id,status,seats,people,minutes,amount,area:id[0]==='V'?'包间':'大厅'}));
const dishes=[['宫保鸡丁','Kung Pao Chicken',48,'热菜','🍲',true],['小炒黄牛肉','Stir-fried Beef',68,'热菜','🥘',true],['酸菜鱼','Pickled Cabbage Fish',78,'热菜','🍜',true],['麻婆豆腐','Mapo Tofu',28,'热菜','🍛',true],['夫妻肺片','Spicy Beef Slices',38,'凉菜','🥗',true],['拍黄瓜','Smashed Cucumber',16,'凉菜','🥒',false],['米饭','Steamed Rice',3,'主食','🍚',false],['酸梅汤','Sour Plum Drink',12,'饮品','🧃',false],['番茄蛋汤','Tomato Egg Soup',18,'汤羹','🥣',false]].map(([name,en,price,cat,emoji,spicy])=>({name,en,price,cat,emoji,spicy}));
const labels={free:'空闲',dining:'用餐中',due:'待结账',late:'上菜超时',clear:'待清台',booked:'已预订'};
const state={view:location.hash==='#order'?'order':'tables',table:'A03',area:'全部桌区',status:'all',category:'推荐',query:'',filter:'全部',orders:{A03:[{name:'宫保鸡丁',qty:1,sent:false},{name:'米饭',qty:4,sent:false},{name:'酸菜鱼',qty:1,sent:true},{name:'夫妻肺片',qty:1,sent:true}]}};
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const current=()=>tables.find(t=>t.id===state.table);const lines=()=>state.orders[state.table]||(state.orders[state.table]=[]);const currency=n=>'¥'+n.toFixed(2);const pending=()=>lines().filter(x=>!x.sent).reduce((n,x)=>n+x.qty,0);const amount=()=>lines().reduce((n,x)=>n+dishes.find(d=>d.name===x.name).price*x.qty,0);const badge=t=>`<span class="status ${['due','late'].includes(t.status)?'amber':['free','clear','booked'].includes(t.status)?'gray':''}">${labels[t.status]}</span>`;
function render(){document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('on',b.dataset.view===state.view);b.setAttribute('aria-current',b.dataset.view===state.view?'page':'false')});$('rail').innerHTML=state.view==='tables'?'<span class="cap">空间</span>'+['全部桌区','大厅','包间'].map(a=>`<button data-area="${a}" class="${state.area===a?'on':''}">${a}</button>`).join('')+'<div class="end">16 张桌台<br>营业中</div>':'<span class="cap">菜单</span>'+['推荐','热菜','凉菜','主食','汤羹','饮品'].map(c=>`<button data-cat="${c}" class="${state.category===c?'on':''}">${c}</button>`).join('')+'<div class="end">午市菜单<br>11:00 — 14:00</div>';
if(state.view==='tables'){const area=tables.filter(t=>state.area==='全部桌区'||t.area===state.area);const filtered=area.filter(t=>(state.status==='all'||(state.status==='dining'?['dining','late'].includes(t.status):t.status===state.status))&&t.id.toLowerCase().includes(state.query.toLowerCase()));$('main').innerHTML=`<div class="heading"><div><h1>桌台总览</h1><p class="small">先找到桌台，再开始服务。</p></div><button class="secondary" data-reset>全部桌台 ↗</button></div><div class="metrics">${[['all','全部桌台',area.length],['free','空闲',area.filter(t=>t.status==='free').length],['dining','用餐中',area.filter(t=>['dining','late'].includes(t.status)).length],['due','待结账',area.filter(t=>t.status==='due').length]].map(([key,label,count])=>`<button class="metric ${state.status===key?'active':''}" data-status="${key}"><span class="small">${label}</span><b>${String(count).padStart(2,'0')}</b></button>`).join('')}</div><div class="toolbar"><label class="search"><span class="sr">搜索桌号</span><input id="search" value="${esc(state.query)}" placeholder="⌕  搜索桌号，如 A03"></label><div class="seg">${[['all','全部状态'],['late','超时'],['clear','待清台'],['booked','预订']].map(([key,label])=>`<button data-status="${key}" class="${state.status===key?'on':''}">${label}</button>`).join('')}</div></div><div class="section-title"><span>${state.area} <span style="margin-left:8px">${filtered.length} 张桌台</span></span><span>按桌号排列</span></div><div class="grid">${filtered.map(t=>`<button class="table ${t.id===state.table?'selected':''} ${['due','late'].includes(t.status)?'attention':''}" data-table="${t.id}" aria-pressed="${t.id===state.table}"><span class="table-top"><b>${t.id}</b><span class="capacity">${t.seats} 人桌</span></span>${badge(t)}<span class="table-foot"><span class="small">${t.status==='free'?'随时入座':t.status==='clear'?'等待清洁':t.status==='booked'?'13:00 · 预订':t.people+' 人 · '+t.minutes+' 分钟'}</span>${t.amount?'<strong>¥'+t.amount+'</strong>':''}</span></button>`).join('')||'<div class="empty">没有符合条件的桌台</div>'}</div>`;tableDetail();}else{const list=dishes.filter(d=>(state.category==='推荐'||d.cat===state.category)&&(!state.query||d.name.includes(state.query)||d.en.toLowerCase().includes(state.query.toLowerCase()))&&(state.filter==='全部'||(state.filter==='辣味'?d.spicy:!d.spicy)));$('main').innerHTML=`<div class="heading"><div><h1>为 ${state.table} 点餐</h1><p class="small">${current().area} · ${current().people||current().seats} 位客人 <span style="margin-left:10px">堂食</span></p></div><button class="secondary" data-back>返回桌台 ↗</button></div><div class="toolbar"><label class="search"><span class="sr">搜索菜品</span><input id="search" value="${esc(state.query)}" placeholder="⌕  搜索菜名或英文名"></label></div><div class="order-tools">${['全部','辣味','不辣'].map(f=>`<button data-filter="${f}" class="${f===state.filter?'on':''}" aria-pressed="${f===state.filter}">${f}</button>`).join('')}<span class="small" style="margin:auto 0 auto auto">${list.length} 道菜</span></div><div class="dish-grid">${list.map(d=>{const q=lines().filter(l=>l.name===d.name).reduce((n,l)=>n+l.qty,0);return `<button class="dish ${q?'chosen':''}" data-add="${d.name}" aria-label="添加${d.name}，${d.price}元"><div class="food">${d.emoji}</div>${q?`<span class="count">已点 ${q}</span>`:''}<div class="dish-info"><b>${d.name}</b><small>${d.en}</small><div class="dish-bottom"><span>¥${d.price}</span><span class="add">+</span></div></div></button>`}).join('')||'<div class="empty">没有找到菜品，试试其他关键词</div>'}</div>`;orderDetail();}}
function tableDetail(){const t=current(),busy=['dining','due','late'].includes(t.status);$('detail').innerHTML=`<div class="detail-head"><div class="topline"><h2>${t.id}</h2>${badge(t)}</div><p class="small">${t.area} · ${t.seats} 人桌</p></div><div class="detail-body">${(busy?[['用餐人数',t.people+' 位'],['已用餐',t.minutes+' 分钟'],['服务员','王芳']]:[['桌台容量',t.seats+' 位'],['当前状态',labels[t.status]],['所属区域',t.area]]).map(([k,v])=>`<div class="kv"><span>${k}</span><span>${v}</span></div>`).join('')}<div class="divider"></div>${busy?`<div class="detail-section"><span>本桌菜品</span><span class="quiet">${lines().length?lines().length+' 项':'暂无明细'}</span></div>${lines().map(l=>`<div class="line"><div>${l.name}<small>${l.sent?'已送厨':'待送厨'} · ${l.qty} 份</small></div><strong>${currency(dishes.find(d=>d.name===l.name).price*l.qty)}</strong></div>`).join('')||'<p class="quiet">此桌仅提供状态示例，可进入点餐创建独立草稿。</p>'}`:`<div class="note">${t.status==='free'?'桌台已准备就绪。开台后进入点餐，为这桌客人创建订单。':t.status==='clear'?'确认桌面清洁完成后，将桌台恢复为空闲。':'此桌预留给预约客人，到店后可开台。'}</div>`}</div><div class="detail-foot">${busy?`<div class="amount"><span>本桌金额${lines().length?'（菜品小计）':''}</span><strong>${currency(lines().length?amount():t.amount)}</strong></div>`:''}<button class="primary" data-start>${busy?'继续点餐':t.status==='clear'?'清台完成':t.status==='booked'?'到店开台':'开台并点餐'}</button><p class="small" style="text-align:center;margin-top:12px">${busy?'选桌只更新详情，不会切走当前总览':'概念演示 · 开台人数按桌台容量填入'}</p></div>`;}
function orderDetail(){const ls=lines(),n=pending();$('detail').innerHTML=`<div class="detail-head"><div class="topline"><h2>${state.table}<span class="small" style="margin-left:12px;font-weight:400">当前订单</span></h2><span class="tag">堂食</span></div><p class="small">${current().people||current().seats} 位客人 · ${ls.reduce((n,l)=>n+l.qty,0)} 份菜品</p></div><div class="detail-body">${[false,true].map(sent=>{const group=ls.map((l,i)=>({...l,i})).filter(l=>l.sent===sent);return group.length?`<div class="detail-section"><span>${sent?'已送厨':'待送厨'}</span><span class="quiet">${group.reduce((n,l)=>n+l.qty,0)} 份</span></div>${group.map(l=>`<div class="order-line"><div class="line"><div>${l.name}<small>${sent?'厨房已接收':'确认后送至厨房'}</small></div><strong>${currency(dishes.find(d=>d.name===l.name).price*l.qty)}</strong></div>${sent?`<div class="quiet" style="margin-top:12px">数量 × ${l.qty}</div>`:`<div class="stepper"><button data-dec="${l.i}" aria-label="减少${l.name}">−</button><span>${l.qty}</span><button data-inc="${l.i}" aria-label="增加${l.name}">+</button></div>`}</div>`).join('')}`:''}).join('')||'<div class="empty">还没有菜品<br><br>点击左侧菜品开始点餐</div>'}</div><div class="detail-foot"><div class="amount"><span>菜品小计</span><strong>${currency(amount())}</strong></div><button class="primary" data-send ${!n?'disabled style="opacity:.45;cursor:default"':''}>${n?'确认送厨 · '+n+' 份':'暂无待送厨菜品'}</button><p class="small" style="text-align:center;margin-top:12px">菜品小计不含服务费与优惠 · 收款在后续工作台处理</p></div>`;}
function view(v){state.view=v;state.query='';location.hash=v;render()}let timer;function toast(s){$('notice').innerHTML=`<div class="toast">${esc(s)}</div>`;clearTimeout(timer);timer=setTimeout(()=>$('notice').innerHTML='',2400)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.view){view(d.view);return}if(d.area){state.area=d.area}else if(d.status){state.status=d.status}else if(d.cat){state.category=d.cat}else if(d.filter){state.filter=d.filter}else if(d.table){state.table=d.table}else if('reset'in d){state.area='全部桌区';state.status='all';state.query=''}else if('back'in d){view('tables');return}else if('start'in d){const t=current();if(t.status==='clear'){t.status='free';t.amount=0;state.orders[t.id]=[];toast(t.id+' 已清台')}else{if(['free','booked'].includes(t.status)){t.status='dining';t.people=t.seats;t.minutes=0}view('order');return}}else if(d.add){const l=lines().find(l=>l.name===d.add&&!l.sent);if(l)l.qty++;else lines().push({name:d.add,qty:1,sent:false})}else if('inc'in d){lines()[+d.inc].qty++}else if('dec'in d){const i=+d.dec;if(--lines()[i].qty===0)lines().splice(i,1)}else if('send'in d){const n=pending();lines().forEach(l=>l.sent=true);current().amount=amount();toast('模拟送厨成功 · '+n+' 份菜品')}render()});
document.addEventListener('input',e=>{if(e.target.id!=='search')return;const caret=e.target.selectionStart;state.query=e.target.value;render();$('search').focus();$('search').setSelectionRange(caret,caret)});addEventListener('hashchange',()=>{const v=location.hash==='#order'?'order':'tables';if(v!==state.view){state.view=v;state.query='';render()}});render();
</script></body></html>
