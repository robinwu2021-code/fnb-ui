<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="942" viewBox="0 0 1320 942" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, Helvetica, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A9099"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="24" y="38" font-size="20" fill="#1F2328" font-weight="700" text-anchor="start">全线点餐 POS 端架构 ② 多设备集群 · 在线 / 离线（局域网 / 互联网）</text><text x="24" y="60" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">一个门店一个局域网；主 POS 是门店的「本地服务器」（Store Hub），副机、KDS、客显、打印都挂在它上面；云是全店和多门店的真相源</text><rect x="24" y="80" width="1272" height="150" rx="12" fill="#E3F5EC"/><text x="44" y="106" font-size="15" fill="#0B6B3A" font-weight="700" text-anchor="start">云端 SaaS（互联网）</text><rect x="44.0" y="120" width="197.0" height="54" rx="8" fill="#FFFFFF"/><text x="142.5" y="143.2" font-size="12" fill="#0B6B3A" font-weight="600" text-anchor="middle">主数据</text><text x="142.5" y="159.2" font-size="12" fill="#0B6B3A" font-weight="400" text-anchor="middle">菜品 / 商品 · 价格 · 配置</text><rect x="251.0" y="120" width="197.0" height="54" rx="8" fill="#FFFFFF"/><text x="349.5" y="143.2" font-size="12" fill="#0B6B3A" font-weight="600" text-anchor="middle">订单中心</text><text x="349.5" y="159.2" font-size="12" fill="#0B6B3A" font-weight="400" text-anchor="middle">全渠道订单 · 对账</text><rect x="458.0" y="120" width="197.0" height="54" rx="8" fill="#FFFFFF"/><text x="556.5" y="143.2" font-size="12" fill="#0B6B3A" font-weight="600" text-anchor="middle">支付网关</text><text x="556.5" y="159.2" font-size="12" fill="#0B6B3A" font-weight="400" text-anchor="middle">聚合支付 · 退款</text><rect x="665.0" y="120" width="197.0" height="54" rx="8" fill="#FFFFFF"/><text x="763.5" y="143.2" font-size="12" fill="#0B6B3A" font-weight="600" text-anchor="middle">渠道聚合</text><text x="763.5" y="159.2" font-size="12" fill="#0B6B3A" font-weight="400" text-anchor="middle">外卖 / 即时零售 / 团购券</text><rect x="872.0" y="120" width="197.0" height="54" rx="8" fill="#FFFFFF"/><text x="970.5" y="143.2" font-size="12" fill="#0B6B3A" font-weight="600" text-anchor="middle">会员营销</text><text x="970.5" y="159.2" font-size="12" fill="#0B6B3A" font-weight="400" text-anchor="middle">储值 · 券 · 积分</text><rect x="1079.0" y="120" width="197.0" height="54" rx="8" fill="#FFFFFF"/><text x="1177.5" y="143.2" font-size="12" fill="#0B6B3A" font-weight="600" text-anchor="middle">报表 · 管理后台</text><text x="1177.5" y="159.2" font-size="12" fill="#0B6B3A" font-weight="400" text-anchor="middle">多门店</text><text x="44" y="205" font-size="12" fill="#0B6B3A" font-weight="400" text-anchor="start">第三方：支付机构 · Uber Eats / Keeta / Talabat · 美团 / 抖音团购 —— 都只和云对接，门店设备不直连</text><line x1="330" y1="230" x2="330" y2="300" stroke="#8A9099" stroke-width="1.5" marker-end="url(#ar)" marker-start="url(#ar)"/><text x="342" y="270" font-size="12" fill="#0B6B3A" font-weight="600" text-anchor="start">互联网：HTTPS + 推送 · Outbox 补传 · 主数据增量</text><line x1="1000" y1="230" x2="1000" y2="300" stroke="#8A9099" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ar)" marker-start="url(#ar)"/><text x="1012" y="262" font-size="12" fill="#0B6B3A" font-weight="600" text-anchor="start">副机直连云（可选）</text><text x="1012" y="280" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">只用于扫码支付等在线能力</text><rect x="24" y="300" width="1272" height="330" rx="12" fill="#FFF1DC" stroke="#E5B97A" stroke-width="1.5" stroke-dasharray="6 4"/><text x="44" y="326" font-size="15" fill="#8F5000" font-weight="700" text-anchor="start">门店局域网 LAN（WebSocket 总线 · mDNS 发现 · 二维码配对）</text><rect x="44" y="345" width="380" height="265" rx="10" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.5"/><text x="64" y="372" font-size="15" fill="#1F2328" font-weight="700" text-anchor="start">主 POS · Store Hub</text><text x="64" y="392" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">收银台那台；门店局域网里的唯一权威</text><rect x="64" y="405" width="340" height="32" rx="6" fill="#F2F3F5"/><text x="234.0" y="425.2" font-size="12" fill="#1F2328" font-weight="600" text-anchor="middle">本地服务（领域服务同一套代码）</text><rect x="64" y="445" width="340" height="32" rx="6" fill="#F2F3F5"/><text x="234.0" y="465.2" font-size="12" fill="#1F2328" font-weight="600" text-anchor="middle">本地库 SQLite · 事件 Outbox</text><rect x="64" y="485" width="340" height="32" rx="6" fill="#F2F3F5"/><text x="234.0" y="505.2" font-size="12" fill="#1F2328" font-weight="600" text-anchor="middle">消息总线（推订单 / 出品 / 状态）</text><rect x="64" y="525" width="340" height="32" rx="6" fill="#F2F3F5"/><text x="234.0" y="545.2" font-size="12" fill="#1F2328" font-weight="600" text-anchor="middle">同步引擎（对云）· 打印调度</text><rect x="64" y="565" width="340" height="32" rx="6" fill="#F2F3F5"/><text x="234.0" y="585.2" font-size="12" fill="#1F2328" font-weight="600" text-anchor="middle">设备注册表 · 授权与审计</text><rect x="470" y="345" width="190" height="110" rx="8" fill="#FFFFFF" stroke="#C9CDD3" stroke-width="1.5"/><text x="565.0" y="387.55" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">副 POS</text><text x="565.0" y="404.55" font-size="13" fill="#1F2328" font-weight="400" text-anchor="middle">第二收银台 · 备主</text><text x="565.0" y="421.55" font-size="13" fill="#1F2328" font-weight="400" text-anchor="middle">主机故障时接管</text><rect x="690" y="345" width="190" height="110" rx="8" fill="#FFFFFF" stroke="#C9CDD3" stroke-width="1.5"/><text x="785.0" y="387.55" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">点菜平板 × N</text><text x="785.0" y="404.55" font-size="13" fill="#1F2328" font-weight="400" text-anchor="middle">服务员 / 导购</text><text x="785.0" y="421.55" font-size="13" fill="#1F2328" font-weight="400" text-anchor="middle">经主机下单</text><rect x="910" y="345" width="190" height="110" rx="8" fill="#FFFFFF" stroke="#C9CDD3" stroke-width="1.5"/><text x="1005.0" y="387.55" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">KDS 厨房屏 × 2</text><text x="1005.0" y="404.55" font-size="13" fill="#1F2328" font-weight="400" text-anchor="middle">出品路由</text><text x="1005.0" y="421.55" font-size="13" fill="#1F2328" font-weight="400" text-anchor="middle">仅餐饮</text><rect x="1110" y="345" width="166" height="110" rx="8" fill="#FFFFFF" stroke="#C9CDD3" stroke-width="1.5"/><text x="1193.0" y="387.55" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">客显 · 叫号屏</text><text x="1193.0" y="404.55" font-size="13" fill="#1F2328" font-weight="400" text-anchor="middle">客显随收银机</text><text x="1193.0" y="421.55" font-size="13" fill="#1F2328" font-weight="400" text-anchor="middle">叫号屏挂主机</text><rect x="470" y="485" width="190" height="110" rx="8" fill="#FFFFFF" stroke="#C9CDD3" stroke-width="1.5"/><text x="565.0" y="527.55" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">打印机</text><text x="565.0" y="544.55" font-size="13" fill="#1F2328" font-weight="400" text-anchor="middle">前台 · 档口 · 标签</text><text x="565.0" y="561.55" font-size="13" fill="#1F2328" font-weight="400" text-anchor="middle">ESC/POS 网口直连</text><rect x="690" y="485" width="190" height="110" rx="8" fill="#FFFFFF" stroke="#C9CDD3" stroke-width="1.5"/><text x="785.0" y="527.55" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">扫码枪 · 电子秤</text><text x="785.0" y="544.55" font-size="13" fill="#1F2328" font-weight="400" text-anchor="middle">USB / 串口</text><text x="785.0" y="561.55" font-size="13" fill="#1F2328" font-weight="400" text-anchor="middle">接在本机，经 HAL</text><rect x="910" y="485" width="190" height="110" rx="8" fill="#FFFFFF" stroke="#C9CDD3" stroke-width="1.5"/><text x="1005.0" y="527.55" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">支付终端</text><text x="1005.0" y="544.55" font-size="13" fill="#1F2328" font-weight="400" text-anchor="middle">刷卡 · 扫码盒</text><text x="1005.0" y="561.55" font-size="13" fill="#1F2328" font-weight="400" text-anchor="middle">交易走云 / 收单行</text><rect x="1110" y="485" width="166" height="110" rx="8" fill="#FFFFFF" stroke="#C9CDD3" stroke-width="1.5"/><text x="1193.0" y="527.55" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle">自助机 · 扫码点餐</text><text x="1193.0" y="544.55" font-size="13" fill="#1F2328" font-weight="400" text-anchor="middle">顾客手机经云</text><text x="1193.0" y="561.55" font-size="13" fill="#1F2328" font-weight="400" text-anchor="middle">下行到主机</text><line x1="424" y1="470" x2="1276" y2="470" stroke="#B8873A" stroke-width="3"/><text x="1270" y="465" font-size="11" fill="#8F5000" font-weight="600" text-anchor="end">LAN 总线</text><line x1="565.0" y1="455" x2="565.0" y2="470" stroke="#B8873A" stroke-width="2"/><line x1="565.0" y1="470" x2="565.0" y2="485" stroke="#B8873A" stroke-width="2"/><line x1="785.0" y1="455" x2="785.0" y2="470" stroke="#B8873A" stroke-width="2"/><line x1="785.0" y1="470" x2="785.0" y2="485" stroke="#B8873A" stroke-width="2"/><line x1="1005.0" y1="455" x2="1005.0" y2="470" stroke="#B8873A" stroke-width="2"/><line x1="1005.0" y1="470" x2="1005.0" y2="485" stroke="#B8873A" stroke-width="2"/><line x1="1193.0" y1="455" x2="1193.0" y2="470" stroke="#B8873A" stroke-width="2"/><line x1="1193.0" y1="470" x2="1193.0" y2="485" stroke="#B8873A" stroke-width="2"/><text x="440" y="620" font-size="12" fill="#8F5000" font-weight="400" text-anchor="start">设备都挂在主机的局域网总线上（WebSocket / ESC/POS）。所有终端跑同一份前端，按「设备角色」加载不同工作台（收银 / 点菜 / KDS / 客显）。</text><text x="24" y="670" font-size="15" fill="#1F2328" font-weight="700" text-anchor="start">在线 / 离线能力矩阵</text><rect x="24" y="684" width="180" height="30" rx="6" fill="#E6E8EB"/><text x="34" y="704" font-size="13" fill="#1F2328" font-weight="700" text-anchor="start"></text><rect x="210" y="684" width="190" height="30" rx="6" fill="#E3F5EC"/><text x="220" y="704" font-size="13" fill="#0B6B3A" font-weight="700" text-anchor="start">① 在线</text><rect x="406" y="684" width="270" height="30" rx="6" fill="#FFF1DC"/><text x="416" y="704" font-size="13" fill="#8F5000" font-weight="700" text-anchor="start">② 断互联网（局域网通）</text><rect x="682" y="684" width="300" height="30" rx="6" fill="#FFF1DC"/><text x="692" y="704" font-size="13" fill="#8F5000" font-weight="700" text-anchor="start">③ 断局域网（单机）</text><rect x="988" y="684" width="300" height="30" rx="6" fill="#FDE7E5"/><text x="998" y="704" font-size="13" fill="#B42318" font-weight="700" text-anchor="start">④ 主机故障</text><rect x="24" y="718" width="180" height="30" rx="6" fill="#F2F3F5"/><text x="34" y="738" font-size="12" fill="#1F2328" font-weight="600" text-anchor="start">点单 · 送厨 · 打印</text><rect x="210" y="718" width="190" height="30" rx="6" fill="#FFFFFF" stroke="#E6E8EB" stroke-width="1.5"/><text x="220" y="738" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">正常</text><rect x="406" y="718" width="270" height="30" rx="6" fill="#FFFFFF" stroke="#E6E8EB" stroke-width="1.5"/><text x="416" y="738" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">正常（主机权威）</text><rect x="682" y="718" width="300" height="30" rx="6" fill="#FFFFFF" stroke="#E6E8EB" stroke-width="1.5"/><text x="692" y="738" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">本机开单、本机打印；KDS 收不到</text><rect x="988" y="718" width="300" height="30" rx="6" fill="#FFFFFF" stroke="#E6E8EB" stroke-width="1.5"/><text x="998" y="738" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">副 POS 升为主，或各机单机</text><rect x="24" y="752" width="180" height="30" rx="6" fill="#F2F3F5"/><text x="34" y="772" font-size="12" fill="#1F2328" font-weight="600" text-anchor="start">现金 · 刷卡</text><rect x="210" y="752" width="190" height="30" rx="6" fill="#FFFFFF" stroke="#E6E8EB" stroke-width="1.5"/><text x="220" y="772" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">正常</text><rect x="406" y="752" width="270" height="30" rx="6" fill="#FFFFFF" stroke="#E6E8EB" stroke-width="1.5"/><text x="416" y="772" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">正常</text><rect x="682" y="752" width="300" height="30" rx="6" fill="#FFFFFF" stroke="#E6E8EB" stroke-width="1.5"/><text x="692" y="772" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">正常</text><rect x="988" y="752" width="300" height="30" rx="6" fill="#FFFFFF" stroke="#E6E8EB" stroke-width="1.5"/><text x="998" y="772" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">正常</text><rect x="24" y="786" width="180" height="30" rx="6" fill="#F2F3F5"/><text x="34" y="806" font-size="12" fill="#1F2328" font-weight="600" text-anchor="start">扫码支付 · 平台券</text><rect x="210" y="786" width="190" height="30" rx="6" fill="#FFFFFF" stroke="#E6E8EB" stroke-width="1.5"/><text x="220" y="806" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">正常</text><rect x="406" y="786" width="270" height="30" rx="6" fill="#FFFFFF" stroke="#E6E8EB" stroke-width="1.5"/><text x="416" y="806" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">暂停（需联网确认）</text><rect x="682" y="786" width="300" height="30" rx="6" fill="#FFFFFF" stroke="#E6E8EB" stroke-width="1.5"/><text x="692" y="806" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">暂停</text><rect x="988" y="786" width="300" height="30" rx="6" fill="#FFFFFF" stroke="#E6E8EB" stroke-width="1.5"/><text x="998" y="806" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">副机直连云可用</text><rect x="24" y="820" width="180" height="30" rx="6" fill="#F2F3F5"/><text x="34" y="840" font-size="12" fill="#1F2328" font-weight="600" text-anchor="start">会员储值 · 券</text><rect x="210" y="820" width="190" height="30" rx="6" fill="#FFFFFF" stroke="#E6E8EB" stroke-width="1.5"/><text x="220" y="840" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">实时</text><rect x="406" y="820" width="270" height="30" rx="6" fill="#FFFFFF" stroke="#E6E8EB" stroke-width="1.5"/><text x="416" y="840" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">本地缓存余额，限额内可用</text><rect x="682" y="820" width="300" height="30" rx="6" fill="#FFFFFF" stroke="#E6E8EB" stroke-width="1.5"/><text x="692" y="840" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">仅查询缓存</text><rect x="988" y="820" width="300" height="30" rx="6" fill="#FFFFFF" stroke="#E6E8EB" stroke-width="1.5"/><text x="998" y="840" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">同 ②</text><rect x="24" y="854" width="180" height="30" rx="6" fill="#F2F3F5"/><text x="34" y="874" font-size="12" fill="#1F2328" font-weight="600" text-anchor="start">外卖 / 线上单</text><rect x="210" y="854" width="190" height="30" rx="6" fill="#FFFFFF" stroke="#E6E8EB" stroke-width="1.5"/><text x="220" y="874" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">实时推到主机</text><rect x="406" y="854" width="270" height="30" rx="6" fill="#FFFFFF" stroke="#E6E8EB" stroke-width="1.5"/><text x="416" y="874" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">收不到；平台侧自动暂停接单</text><rect x="682" y="854" width="300" height="30" rx="6" fill="#FFFFFF" stroke="#E6E8EB" stroke-width="1.5"/><text x="692" y="874" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">收不到</text><rect x="988" y="854" width="300" height="30" rx="6" fill="#FFFFFF" stroke="#E6E8EB" stroke-width="1.5"/><text x="998" y="874" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">推到新主机</text><rect x="24" y="888" width="180" height="30" rx="6" fill="#F2F3F5"/><text x="34" y="908" font-size="12" fill="#1F2328" font-weight="600" text-anchor="start">数据</text><rect x="210" y="888" width="190" height="30" rx="6" fill="#FFFFFF" stroke="#E6E8EB" stroke-width="1.5"/><text x="220" y="908" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">实时上云</text><rect x="406" y="888" width="270" height="30" rx="6" fill="#FFFFFF" stroke="#E6E8EB" stroke-width="1.5"/><text x="416" y="908" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">进 Outbox，恢复后补传</text><rect x="682" y="888" width="300" height="30" rx="6" fill="#FFFFFF" stroke="#E6E8EB" stroke-width="1.5"/><text x="692" y="908" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">本机 Outbox，回到局域网先并入主机</text><rect x="988" y="888" width="300" height="30" rx="6" fill="#FFFFFF" stroke="#E6E8EB" stroke-width="1.5"/><text x="998" y="908" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">新主机从副本恢复</text></svg>